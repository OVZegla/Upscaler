name: Build Tauri Preview (Symp's Upscale)

on:
  push:
    branches:
      - claude/symp-tauri-preview
  workflow_dispatch:

jobs:
  tauri-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            artifact: symps-upscale-tauri-win
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            artifact: symps-upscale-tauri-mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm install

      - name: Stage resources (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p src-tauri/resources/bin src-tauri/resources/models
          cp -r resources/win/bin/* src-tauri/resources/bin/
          cp -r resources/models/* src-tauri/resources/models/

      - name: Stage resources (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p src-tauri/resources/bin src-tauri/resources/models
          cp -r resources/mac/bin/* src-tauri/resources/bin/
          chmod +x src-tauri/resources/bin/upscayl-bin
          cp -r resources/models/* src-tauri/resources/models/

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Ad-hoc codesign (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
          if [ -n "$APP" ]; then
            echo "Ad-hoc signing $APP"
            # Sign bundled binaries first (deep), then the app itself.
            # Ad-hoc signature (-s -) lets Apple Silicon actually launch the app.
            # Without it, macOS reports the app as "damaged" and refuses to open.
            codesign --force --deep --sign - "$APP"
            codesign --verify --deep --verbose=2 "$APP" || true
          else
            echo "No .app bundle found to sign"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          retention-days: 30
          if-no-files-found: warn
