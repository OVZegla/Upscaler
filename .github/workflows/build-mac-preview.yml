name: Build macOS Preview (Symp's Upscale)

on:
  push:
    branches:
      - claude/symp-mac-preview
  workflow_dispatch:

jobs:
  mac-preview:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: |
          npm install
          rm -rf node_modules/sharp
          npm install --platform=darwin --arch=x64 sharp
          npm rebuild --platform=darwin --arch=arm64 sharp

      - name: Patch package.json for unsigned build
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            delete pkg.build.afterSign;
            if (pkg.build.mac) {
              delete pkg.build.mac.provisioningProfile;
              pkg.build.mac.identity = null;
              pkg.build.mac.hardenedRuntime = false;
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            console.log('package.json patched successfully');
          "

      - name: TypeScript compile (electron)
        run: npx tsc

      - name: Next.js build
        run: node scripts/validate-schema.js && npx next build renderer

      - name: Build macOS zip (unsigned, no notarization)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder build -m zip --universal --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: symps-upscale-mac
          path: dist/*.zip
          retention-days: 30
          if-no-files-found: error
