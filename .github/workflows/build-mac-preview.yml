name: Build macOS Preview (Symp's Upscale)

on:
  push:
    branches:
      - claude/symp-mac-preview
  workflow_dispatch:

jobs:
  mac-preview:
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: |
          npm install
          rm -rf node_modules/sharp
          npm install --platform=darwin --arch=x64 sharp
          npm rebuild --platform=darwin --arch=arm64 sharp

      - name: Build macOS zip (unsigned, no notarization)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx tsc
          npm run build
          npx electron-builder build -m zip --universal \
            --config.mac.identity=null \
            --config.afterSign="" \
            --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: symps-upscale-mac
          path: dist/*.zip
          retention-days: 30
          if-no-files-found: error
